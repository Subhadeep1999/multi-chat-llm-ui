<div class="word-analysis-container" *ngIf="analysis">
  <div class="analysis-header">
    <h3>📊 Text Analysis</h3>
  </div>

  <div class="analysis-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Words</div>
        <div class="stat-value">{{ analysis.total_words }}</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Unique Words (excluding stop words)</div>
        <div class="stat-value">{{ analysis.word_count }}</div>
      </div>
    </div>

    <div class="top-words-section">
      <h4>Top 5 Most Frequent Words</h4>
      <ng-container *ngIf="analysis.top_5_words && analysis.top_5_words.length > 0; else noWords">
        <ul class="words-list">
          <li class="word-item" *ngFor="let item of analysis.top_5_words; let i = index">
            <span class="rank">{{ i + 1 }}.</span>
            <span class="word">{{ item.word }}</span>
            <span class="count">{{ item.count }}</span>
          </li>
        </ul>
      </ng-container>
      <ng-template #noWords>
        <p class="no-words">No frequent words found</p>
      </ng-template>
    </div>
  </div>
</div>
