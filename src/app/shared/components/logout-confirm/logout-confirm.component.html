<div class="overlay">
  <div class="modal">
    <h3>Confirm Logout</h3>
    <p>Are you sure you want to log out?</p>
    <div class="actions">
      <button class="btn cancel" (click)="onCancel()">Cancel</button>
      <button class="btn confirm" (click)="onConfirm()">Logout</button>
    </div>
  </div>
</div>
