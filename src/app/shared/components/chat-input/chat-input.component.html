<form class="chat-input" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
  <input
    type="text"
    formControlName="prompt"
    (keydown.enter)="submit()"
    placeholder="Type your prompt..."
    class="prompt-input"
    aria-label="Prompt input"
  />
  <button type="submit" class="send-btn" aria-label="Send prompt">
    Send
  </button>
</form>
