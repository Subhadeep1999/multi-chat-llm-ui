<div class="bg">
  <div class="login-card" role="form" aria-label="Login form">
    <h1 class="app-title">Multi-LLM Compare</h1>
    <p class="tag">Compare responses from multiple LLMs side-by-side</p>


    <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
      <label>
        <input formControlName="username" (keydown.enter)="submit()" placeholder="Username" aria-label="Username" />
      </label>
      <label>
        <input formControlName="password" type="password" placeholder="Password" aria-label="Password" />
      </label>
      <button type="submit" class="login-btn">Sign in</button>
    </form>

    <div class="hint">Hint: <strong>admin</strong> / <em>password123</em></div>
  </div>
</div>
