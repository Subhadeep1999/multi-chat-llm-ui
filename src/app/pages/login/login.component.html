<div class="bg">
  <div class="login-card">
    <h1 class="app-title">Multi-LLM Compare</h1>
    <p class="tag">Compare multiple LLMs side-by-side</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <input formControlName="email" placeholder="Email" />
      <input type="password" formControlName="password" placeholder="Password" />

      <button class="login-btn" [disabled]="loading">
        {{ isRegister ? 'Create Account' : 'Sign In' }}
      </button>
    </form>

    <button class="login-btn" type="button" (click)="googleLogin()" [disabled]="loading" style="width:100%;margin-top:12px">
      Sign in with Google
    </button>

    <div *ngIf="errorMsg" class="error-msg" style="color:#e11d48;margin:10px 0 0 0;">{{ errorMsg }}</div>

    <div class="hint">
      <a (click)="toggleMode()">
        {{ isRegister ? 'Already have an account? Sign in' : 'New here? Create an account' }}
      </a>
    </div>
  </div>
</div>
