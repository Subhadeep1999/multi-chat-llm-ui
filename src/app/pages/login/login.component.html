<div class="login-bg-animated">
  <div class="login-cards-wrapper">
    <ng-container *ngIf="!showRegister; else registerBlock">
      <div class="login-card">
        <div class="chat-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#7c3aed"/><path d="M8 13h8M8 9h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h2>Welcome Back</h2>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <input formControlName="email" placeholder="Email" type="email" />
          <div class="password-field">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password" />
            <span class="eye-icon" (click)="toggleShowPassword()">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M3 3l18 18M1 12s4-7 11-7c2.5 0 4.6.7 6.3 1.7M23 12s-4 7-11 7c-2.5 0-4.6-.7-6.3-1.7"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
            </span>
          </div>
          <button type="submit" [disabled]="loading">Login</button>
          <button type="button" class="google-login-btn" (click)="loginWithGoogle()">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" style="width:20px;vertical-align:middle;margin-right:8px;" />
            Sign in with Google
          </button>
          <div class="error" *ngIf="error">{{ error }}</div>
        </form>
        <div class="register-link">
          Don't have an account?
          <a href="#" (click)="toggleRegister(); $event.preventDefault()">Register</a>
        </div>
      </div>
    </ng-container>
    <ng-template #registerBlock>
      <div class="register-card">
        <div class="chat-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#7c3aed"/><path d="M8 13h8M8 9h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h2>Create Account</h2>
        <app-register (registered)="showRegister=false"></app-register>
        <div class="register-link">
          Already have an account?
          <a href="#" (click)="toggleRegister(); $event.preventDefault()">Login</a>
        </div>
      </div>
    </ng-template>
  </div>
</div>
