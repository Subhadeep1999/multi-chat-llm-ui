<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <span style="font-weight: 700; font-size: 1.1rem; color: #a5b4fc;">Chats</span>
    </div>
    <button class="new-chat" (click)="startNewChat()">+ New Chat</button>
    <div class="conversation-list">
      <div *ngFor="let conv of conversations" class="conversation" [class.active]="conv === activeConversation">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div (click)="selectConversation(conv)" style="flex: 1; cursor: pointer;">
            <div class="sidebar-chat-name" [title]="conv.messages[0]?.content || 'New Conversation'">
              {{ conv.messages[0]?.content || 'New Conversation' }}
            </div>
            <div style="font-size: 0.78rem; color: #94a3b8;">
              {{ conv.createdAt | date:'short' }}
            </div>
          </div>
          <button class="delete-chat-btn" (click)="deleteConversation(conv, $event)" title="Delete chat">
            <svg class="sidebar-delete-x" width="22" height="22" viewBox="0 0 24 24" fill="none"
              style="vertical-align: middle;">
              <circle cx="12" cy="12" r="10" stroke="#f87171" stroke-width="2" fill="none" />
              <path d="M9 9l6 6M15 9l-6 6" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-area chat-window-redesign">
    <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 10px;">
      <!-- Sparkles SVG Icon -->
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 2v2m0 16v2m8-8h2M2 12H4m13.657-6.343l1.414 1.414M4.929 19.071l1.414-1.414m0-12.728L4.929 4.929m12.728 12.728l1.414 1.414M12 6a6 6 0 100 12 6 6 0 000-12z"
          stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2 class="app-title-gradient">Multi-LLM Chat</h2>
    </div>
    <ng-container *ngIf="activeConversation; else noConversation">
      <div class="chat-messages-scroll grouped-chat">
        <ng-container *ngFor="let group of getPromptResponseGroups()">
          <div class="prompt-row" style="display: flex; justify-content: flex-end;">
            <div class="vibrant-prompt"
              style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.4); padding: 10px 16px; border-radius: 12px; display: inline-flex; align-items: center; margin: 10px 0;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <span
                style="font-weight: 600; font-size: 0.95rem; color: #e2e8f0; letter-spacing: 0.5px; opacity: 0.9;">Prompt:</span>
              <span style="margin-left: 8px; color: #ffffff; font-size: 0.95rem; font-weight: 400;">{{
                group.prompt.content }}</span>
            </div>
          </div>
          <div class="llm-card-row">
            <app-model-card [modelName]="'Gemini'" [response]="group.responses.gemini"
              [isLoading]="group.loading && !group.responses.gemini" [modelOptions]="[]" [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.gemini"
              [showReset]="group.isLatest && group.selectedLlm === 'gemini'" [selected]="group.selectedLlm === 'gemini'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'gemini'" (select)="onSelectLlm(group, $event)"
              (modelChange)="null">
            </app-model-card>
            <app-model-card [modelName]="'DeepSeek Chat'" [response]="group.responses.deepseek_chat"
              [isLoading]="group.loading && !group.responses.deepseek_chat" [modelOptions]="[]" [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.deepseek_chat"
              [showReset]="group.isLatest && group.selectedLlm === 'deepseek_chat'"
              [selected]="group.selectedLlm === 'deepseek_chat'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'deepseek_chat'"
              (select)="onSelectLlm(group, $event)" (modelChange)="null">
            </app-model-card>
            <app-model-card [modelName]="'DeepSeek Coder'" [response]="group.responses.deepseek_coder"
              [isLoading]="group.loading && !group.responses.deepseek_coder" [modelOptions]="[]" [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.deepseek_coder"
              [showReset]="group.isLatest && group.selectedLlm === 'deepseek_coder'"
              [selected]="group.selectedLlm === 'deepseek_coder'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'deepseek_coder'"
              (select)="onSelectLlm(group, $event)" (modelChange)="null">
            </app-model-card>
          </div>
        </ng-container>
      </div>
    </ng-container>
    <ng-template #noConversation>
      <div style="color:#64748b; margin-bottom:24px;">Start a new chat to begin your conversation.</div>
    </ng-template>
    <!-- Input -->
    <app-chat-input [loading]="loading" (send)="send($event)">
    </app-chat-input>
  </main>
</div>
