<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <span style="font-weight: 700; font-size: 1.1rem; color: #a5b4fc;">Chats</span>
    </div>
    <button class="new-chat" (click)="startNewChat()">+ New Chat</button>
    <div class="conversation-list">
      <div *ngFor="let conv of conversations" class="conversation" [class.active]="conv === activeConversation">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div (click)="selectConversation(conv)" style="flex: 1; cursor: pointer;">
            <div style="font-size: 0.98rem; font-weight: 500; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              {{ conv.messages[0]?.content || 'New Conversation' }}
            </div>
            <div style="font-size: 0.78rem; color: #94a3b8;">
              {{ conv.createdAt | date:'short' }}
            </div>
          </div>
          <button class="delete-chat-btn" (click)="deleteConversation(conv, $event)" title="Delete chat">
            <span style="color:#f87171;font-size:1.1em;">&#128465;</span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-area chat-window-redesign">
    <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 10px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#a5b4fc"/><path d="M7 12h10M12 7v10" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round"/></svg>
      <h2 style="margin:0; font-size:1.6rem; color:#6d28d9; font-weight: 800; letter-spacing: 1px;">Multi-LLM Chat</h2>
    </div>
    <ng-container *ngIf="activeConversation; else noConversation">
      <div class="chat-messages-scroll grouped-chat">
        <ng-container *ngFor="let group of getPromptResponseGroups()">
          <div class="prompt-row" style="display: flex; justify-content: flex-end;">
            <div class="vibrant-prompt">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="vertical-align: middle; margin-right: 6px;"><rect x="2" y="2" width="20" height="20" rx="6" fill="#38bdf8"/><path d="M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
              <span style="font-weight: 600; font-size: 1.08rem; color: #0f172a; letter-spacing: 0.5px;">Prompt:</span>
              <span style="margin-left: 8px; color: #0f172a; font-size: 1.08rem;">{{ group.prompt.content }}</span>
            </div>
          </div>
          <div class="llm-card-row">
            <app-model-card
              [modelName]="'Gemini'"
              [response]="group.responses.gemini"
              [isLoading]="group.loading && !group.responses.gemini"
              [modelOptions]="[]"
              [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.gemini"
              [showReset]="group.isLatest && group.selectedLlm === 'gemini'"
              [selected]="group.selectedLlm === 'gemini'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'gemini'"
              (select)="onSelectLlm(group, $event)"
              (modelChange)="null">
            </app-model-card>
            <app-model-card
              [modelName]="'DeepSeek Chat'"
              [response]="group.responses.deepseek_chat"
              [isLoading]="group.loading && !group.responses.deepseek_chat"
              [modelOptions]="[]"
              [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.deepseek_chat"
              [showReset]="group.isLatest && group.selectedLlm === 'deepseek_chat'"
              [selected]="group.selectedLlm === 'deepseek_chat'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'deepseek_chat'"
              (select)="onSelectLlm(group, $event)"
              (modelChange)="null">
            </app-model-card>
            <app-model-card
              [modelName]="'DeepSeek Coder'"
              [response]="group.responses.deepseek_coder"
              [isLoading]="group.loading && !group.responses.deepseek_coder"
              [modelOptions]="[]"
              [selectedModel]="''"
              [showSelect]="group.isLatest && !group.selectedLlm && group.responses.deepseek_coder"
              [showReset]="group.isLatest && group.selectedLlm === 'deepseek_coder'"
              [selected]="group.selectedLlm === 'deepseek_coder'"
              [disabled]="group.selectedLlm && group.selectedLlm !== 'deepseek_coder'"
              (select)="onSelectLlm(group, $event)"
              (modelChange)="null">
            </app-model-card>
          </div>
        </ng-container>
      </div>
    </ng-container>
    <ng-template #noConversation>
      <div style="color:#64748b; margin-bottom:24px;">Start a new chat to begin your conversation.</div>
    </ng-template>
    <!-- Input -->
    <app-chat-input
      [loading]="loading"
      (send)="send($event)">
    </app-chat-input>
  </main>
</div>
