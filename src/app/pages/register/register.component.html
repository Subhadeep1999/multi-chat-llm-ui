<div class="register-container">
  <h2>Register</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <input formControlName="email" placeholder="Email" type="email" />
    <div class="password-field">
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password" />
      <span class="eye-icon" (click)="toggleShowPassword()">
        <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
        <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M3 3l18 18M1 12s4-7 11-7c2.5 0 4.6.7 6.3 1.7M23 12s-4 7-11 7c-2.5 0-4.6-.7-6.3-1.7"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
      </span>
    </div>
    <div class="password-field">
      <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Confirm Password" />
      <span class="eye-icon" (click)="toggleShowConfirmPassword()">
        <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
        <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path stroke="#6366f1" stroke-width="2" d="M3 3l18 18M1 12s4-7 11-7c2.5 0 4.6.7 6.3 1.7M23 12s-4 7-11 7c-2.5 0-4.6-.7-6.3-1.7"/><circle cx="12" cy="12" r="3" stroke="#6366f1" stroke-width="2"/></svg>
      </span>
    </div>
    <button type="submit" [disabled]="loading">Register</button>
    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
